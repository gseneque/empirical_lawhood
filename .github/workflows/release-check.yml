# SPDX-License-Identifier: MPL-2.0
name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit additional profile (bounded CI always runs)
        type: choice
        default: ci
        options: [ci, integration, scale, native-open, native-brian2, held-reactor, held-response]
      changed_test_audit_base:
        description: Optional base commit for an exact changed-test evidence audit
        type: string
        default: ''
      changed_test_evidence_runs:
        description: Optional evidence run IDs for the selected changed-test audit base
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  portable:
    name: portable-ci-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Keep the frozen RC descriptor recipe on the original numerical dispatch.
      OPENBLAS_CORETYPE: HASWELL
      NPY_DISABLE_CPU_FEATURES: X86_V4,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Retrieve explicitly selected changed-test evidence
        if: github.event_name == 'workflow_dispatch' && inputs.changed_test_audit_base != '' && inputs.changed_test_evidence_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_IDS: ${{ inputs.changed_test_evidence_runs }}
        run: |
          read -ra selected_runs <<< "$EVIDENCE_RUN_IDS"
          for run_id in "${selected_runs[@]}"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Evidence run IDs must be numeric" >&2; exit 1; }
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'integration-*' --pattern 'scale-*' --pattern 'portable-evidence-*' \
              --dir "$RUNNER_TEMP/changed-test-evidence/$run_id"
          done
      - name: Check recursive lifecycle, bounded contracts and exact installed artifacts
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUDIT_BASE: ${{ inputs.changed_test_audit_base }}
        run: |
          change_args=()
          if [[ -n "$AUDIT_BASE" ]]; then
            change_args=(--changed-tests-base "$AUDIT_BASE")
            shopt -s nullglob
            for artifact in "$RUNNER_TEMP/changed-test-evidence"/* "$RUNNER_TEMP/changed-test-evidence"/*/*; do
              for evidence in "$artifact/release-manifest.json" "$artifact/precommit-portable-evidence.json"; do
                if [[ -f "$evidence" ]]; then
                  change_args+=(--changed-test-evidence "$evidence")
                fi
              done
            done
          elif [[ "$GITHUB_REF_TYPE" != tag ]]; then
            base="${PR_BASE:-$PUSH_BASE}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH") || base=''
            fi
            if [[ -n "$base" ]]; then
              change_args=(--bounded-changes-since "$base")
            fi
          fi
          uv run --locked --python 3.11.14 --group build --group reactor-example python scripts/release_check.py --profile ci "${change_args[@]}" --output-dir "$RUNNER_TEMP/portable-packet"
      - name: Retain selection, fixtures, logs and exact builds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-packet/release-manifest.json
            ${{ runner.temp }}/portable-packet/release-status.json
            ${{ runner.temp }}/portable-packet/logs
            ${{ runner.temp }}/portable-packet/test-selection.json
            ${{ runner.temp }}/portable-packet/test-execution.json
            ${{ runner.temp }}/portable-packet/test-artifacts
            ${{ runner.temp }}/portable-packet/source.tar
            ${{ runner.temp }}/portable-packet/sdist-source-inventory.json
            ${{ runner.temp }}/portable-packet/researcher-input-inventory.json
            ${{ runner.temp }}/portable-packet/installed-smoke
            ${{ runner.temp }}/portable-packet/package-inventory.json
            ${{ runner.temp }}/portable-packet/wheel-requirements.txt
            ${{ runner.temp }}/portable-packet/artifacts
          if-no-files-found: error
          retention-days: 30
  portable-extended:
    name: selected-${{ inputs.profile }}-${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["integration", "scale"]'), inputs.profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SELECTED_PROFILE: ${{ inputs.profile }}
      SELECTED_SHARD: ${{ matrix.shard }}
      OPENBLAS_CORETYPE: HASWELL
      NPY_DISABLE_CPU_FEATURES: X86_V4,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: {version: '0.11.28', enable-cache: true, cache-dependency-glob: uv.lock}
      - name: Run selected module shard
        run: uv run --locked --python 3.11.14 --group build --group reactor-example python scripts/release_check.py --profile "$SELECTED_PROFILE" --shard-index "$SELECTED_SHARD" --shard-count 4 --output-dir "$RUNNER_TEMP/extended-packet"
      - name: Retain shard evidence and disclosed fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.profile }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/extended-packet/release-manifest.json
            ${{ runner.temp }}/extended-packet/release-status.json
            ${{ runner.temp }}/extended-packet/logs
            ${{ runner.temp }}/extended-packet/test-selection.json
            ${{ runner.temp }}/extended-packet/test-execution.json
            ${{ runner.temp }}/extended-packet/test-artifacts
            ${{ runner.temp }}/extended-packet/source.tar
          if-no-files-found: error
          retention-days: 30
  native:
    name: selected-native-check
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'native-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SELECTED_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: {version: '0.11.28', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv run --locked --python 3.11.14 --group build --group reactor-example python scripts/release_check.py --profile "$SELECTED_PROFILE" --output-dir "$RUNNER_TEMP/native-packet"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-packet/release-manifest.json
            ${{ runner.temp }}/native-packet/release-status.json
            ${{ runner.temp }}/native-packet/logs
          if-no-files-found: error
          retention-days: 30
  held:
    name: selected-held-check
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'held-')
    # Maintainer-managed runner: exact external mounts and read authority must
    # already be supplied under the held-input environment; never public fixtures.
    runs-on: [self-hosted, linux, x64, empirical-lawhood-held]
    environment: held-inputs
    timeout-minutes: 120
    env:
      SELECTED_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: {version: '0.11.28', enable-cache: false}
      - run: uv run --locked --python 3.11.14 --group build --group reactor-example python scripts/release_check.py --profile "$SELECTED_PROFILE" --output-dir "$RUNNER_TEMP/held-packet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      # Held logs stay on the permitted runner. Upload only deliberately reviewed
      # derivatives; private paths and source material are not public CI artifacts.
