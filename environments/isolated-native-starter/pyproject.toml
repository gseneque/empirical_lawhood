[project]
name = "empirical-lawhood-isolated-native-starter"
version = "0.1.0"
requires-python = ">=3.11.14,<3.12"
# Independent worker environment. Keep the controller's selected environment
# unchanged. The wheel's declared NumPy >=2,<3 contract permits this profile.
dependencies = [
  "alembic==1.20.0", "annotated-doc==0.0.5", "cffi==2.1.1",
  "cryptography==46.0.7", "h5py==3.14.0", "mako==1.4.3",
  "markdown-it-py==4.2.0", "markupsafe==3.0.3", "mdurl==0.1.2",
  "ml-dtypes==0.6.0", "mpmath==1.3.0", "numpy==2.3.5",
  "onnx==1.23.0", "protobuf==7.36.2", "pyarrow==23.0.1",
  "pycparser==3.0", "pygments==2.21.0", "python-flint==0.8.0",
  "pyyaml==6.0.3", "rich==15.0.0", "safetensors==0.8.0",
  "scipy==1.17.1", "shellingham==1.5.4", "sqlalchemy==2.1.1",
  "threadpoolctl==3.7.0", "typer==0.27.2", "typing-extensions==4.16.0",
]

[tool.uv]
package = false
